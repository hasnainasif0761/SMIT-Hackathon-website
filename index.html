<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT-Hackathon-Project</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Navbar Section Start -->
     <header>
        <div class="container-fluid" style="padding-left: 130px; padding-right: 100px;">
            <div class="row">
            <div class="nav">
                <div class="logo">
                 <img src="./images/logo.png" alt="">
                </div>
                <div>
                   <ul  class="links d-none d-sm-flex">
                    <li><a href="#">Become a renter</a></li>
                    <li><a href="#">Rental deals</a></li>
                    <li><a href="#">How it work</a></li>
                    <li><a href="#">Why choos us</a></li>
                   </ul>
                </div>
                <div class="nav_btn">
                   <button class="btn">Sign in</button>
                   <button class="btn  button">Sign up</button>
                </div>
            </div>
            </div>
        </div>
     </header>
     <!-- Navbar Section End -->

     <!-- Hero Section Start -->
        <div class="container-fluid">
            <div class="row border" style="overflow-x: hidden; position: relative;">
                <div class="col-lg-6">
                    <div class="hero_content">
                        <div class="content_img">
                       <h1>Find, book and <br>rent a car <span style="color: #1572D3;">Easily</span></h1>
                       <img src="./images/Vector 1.png" alt="">
                       </div>
                       <p>Get a car wherever and whenever you <br>need it with your IOS and Android device.</p>
                       <div class="hero_content_btn">
                       <button><img src="./images/image 2.png" alt=""></button>
                       <button><img src="./images/image 3.png" alt=""></button>
                       </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="hero_main">
                        <div class="hero_img">
                            <img class="img_1" src="./images/Frame1.png" alt="frame_1">
                            <img src="./images/car.png" class="img_2" alt="car_image">
                        </div>
                    </div>
                </div>
            </div>
        </div>
      <!-- Hero Section End -->
       <!-- Room Search Section Start  -->
        <div class="container border mb-3">
          <div class="row">
            <div class="col-lg-3 border room_search">
                <div class="room_main">
                    <div class="location_cont_icon">
                        <i class="ri-map-pin-line" style="border: 1px solid red;"></i>
                    </div>
                    <div class="location_cont_content border">
                        <p>Location</p>
                        <p>Search your Location</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="room_main">
                    <div class="location_cont_icon">
                        <i class="ri-calendar-2-line"></i>
                    </div>
                    <div class="location_cont_content border">
                        <p>Pickup date</p>
                        <p>Tue 15 Feb 09:00</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="room_main">
                    <div class="location_cont_icon">
                        <i class="ri-calendar-2-line"></i>
                    </div>
                    <div class="location_cont_content border">
                        <p>Return date date</p>
                        <p>Tue 15 Feb 09:00</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <button class="btn btn-primary">Search</button>
            </div>
          </div>
        </div>
       <!-- Room Search Section End  -->
</body>
</html>
